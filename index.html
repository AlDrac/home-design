<style>

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}

<script>
const el=document.getElementById('cv'),ov=document.getElementById('ov');
let W0=el.clientWidth,H0=el.clientHeight;
const scene=new THREE.Scene();
const ren=new THREE.WebGLRenderer({antialias:true,alpha:true});
ren.setSize(W0,H0);ren.setPixelRatio(Math.min(devicePixelRatio,2));el.appendChild(ren.domElement);
scene.add(new THREE.AmbientLight(0xffffff,0.72));
const dl=new THREE.DirectionalLight(0xffffff,0.55);dl.position.set(500,900,1200);scene.add(dl);
const dl2=new THREE.DirectionalLight(0xffffff,0.3);dl2.position.set(-300,-300,300);scene.add(dl2);
const lineMat=new THREE.LineBasicMaterial({color:0x5F5E5A});
const G={L:new THREE.Group(),R:new THREE.Group(),W:new THREE.Group(),T:new THREE.Group(),F:new THREE.Group(),H:new THREE.Group(),S:new THREE.Group(),C:new THREE.Group(),LD:new THREE.Group(),RD:new THREE.Group(),LG:new THREE.Group(),RG:new THREE.Group(),LL:new THREE.Group(),RL:new THREE.Group()};
G.L.add(G.LD);G.R.add(G.RD);G.L.add(G.LG);G.R.add(G.RG);G.L.add(G.LL);G.R.add(G.RL);
[G.L,G.R,G.W,G.T,G.F,G.H,G.S,G.C].forEach(g=>scene.add(g));
function box(g,x,y,z,w,h,d,col,op,noEdge){
  const geo=new THREE.BoxGeometry(w,h,d);
  const m=new THREE.MeshLambertMaterial({color:col,transparent:op!==undefined,opacity:op===undefined?1:op});
  const me=new THREE.Mesh(geo,m);me.position.set(x+w/2,y+h/2,z+d/2);g.add(me);
  if(!noEdge){const ln=new THREE.LineSegments(new THREE.EdgesGeometry(geo),lineMat);ln.position.copy(me.position);g.add(ln);}
  return me;
}
function bx(g,s,xd,y,z,wd,h,dz,col,op){box(g,s==='L'?xd:260-xd-wd,y,z,wd,h,dz,col,op)}
function led(g,s,xd,y,z,wd,h,dz,col,op){
  const x=s==='L'?xd:260-xd-wd;
  const m=new THREE.MeshBasicMaterial({color:col,transparent:op!==undefined,opacity:op===undefined?1:op,side:THREE.DoubleSide});
  const me=new THREE.Mesh(new THREE.BoxGeometry(wd,h,dz),m);me.position.set(x+wd/2,y+h/2,z+dz/2);g.add(me);
}
const CAB=0xD3D1C7,FR=0xE8E6DD,APP=0xAFA9EC,APF=0xCECBF6,TOP=0xB98A5E,DARK=0x444441,SH=0x888780,LED=0xFFC857;

/* ---------- Открывающиеся двери и ящики ---------- */
const MOVS=[];
function reg(obj,m){m.obj=obj;m.t=0;m.target=0;obj.userData.mov=m;MOVS.push(m);return obj;}
function lbox(par,s,lx,y,lz,dx,h,dz,col,op){return box(par,s==='L'?lx:-lx-dx,y,lz,dx,h,dz,col,op);}
function makeSwing(par,s,x1,y,h,z,w,hingeMin,fc,hy,nh){
  const piv=new THREE.Group();piv.position.set(s==='L'?x1:260-x1,0,hingeMin?z:z+w);par.add(piv);
  const lz0=hingeMin?0:-w;
  lbox(piv,s,0,y+0.3,lz0+0.3,0.8,h-0.6,w-0.6,fc);
  if(!nh)lbox(piv,s,0.8,hy,hingeMin?w-5:5-w,1.2,12,1.2,DARK);
  return reg(piv,{type:'swing',amp:(s==='L'?1:-1)*(hingeMin?1:-1)*1.75});
}
function makeDrawer(par,s,x1,y0,y1,z,w,fc,D,ft,nh){
  const grp=new THREE.Group();par.add(grp);const yt=ft||y1;
  bx(grp,s,x1,y0+0.3,z+0.3,0.8,yt-y0-0.6,w-0.6,fc);
  if(!nh)bx(grp,s,x1+0.8,(y0+y1)/2,z+w/2-7,1.2,1.2,14,DARK);
  const bh=Math.max(5,y1-y0-6);
  bx(grp,s,x1-D,y0+2,z+2,D,bh,1.2,CAB);bx(grp,s,x1-D,y0+2,z+w-3.2,D,bh,1.2,CAB);
  bx(grp,s,x1-D,y0+2,z+2,D,1.2,w-4,CAB);bx(grp,s,x1-D,y0+2,z+2,1.2,bh,w-4,CAB);
  return reg(grp,{type:'slide',amp:(s==='L'?1:-1)*Math.min(40,D-5)});
}
function makeDrop(par,s,x1,y){
  const piv=new THREE.Group();piv.position.set(s==='L'?x1:260-x1,y,0);par.add(piv);
  reg(piv,{type:'drop',amp:(s==='L'?-1:1)*1.5});return piv;
}
function easeIO(t){return t<0.5?2*t*t:1-Math.pow(-2*t+2,2)/2;}
function stepMovs(dt){
  let any=false;
  MOVS.forEach(m=>{
    if(m.t===m.target)return;any=true;
    const d=m.target-m.t,st=dt*2.2;
    m.t=Math.abs(d)<=st?m.target:m.t+Math.sign(d)*st;
    const e=easeIO(m.t);
    if(m.type==='swing')m.obj.rotation.y=m.amp*e;
    else if(m.type==='drop')m.obj.rotation.z=m.amp*e;
    else if(m.type==='slidez')m.obj.position.z=m.amp*e;
    else m.obj.position.x=m.amp*e;
  });
  return any;
}

/* ---------- Ножки 25 см (верх Ø5, низ Ø3,7) ---------- */
const LEGC=0xD9B98C;
function leg(par,x,z,sx,sz){
  const g=new THREE.CylinderGeometry(2.5,1.85,25,16);g.translate(0,-12.5,0);
  const m=new THREE.Mesh(g,new THREE.MeshLambertMaterial({color:LEGC}));
  m.position.set(x,25,z);m.rotation.z=sx*0.14;m.rotation.x=-sz*0.14;par.add(m);
}

/* ---------- Дом: полы, стены, лестница ---------- */
const CEIL=248;
function floor(x0,z0,x1,z1,col,op){box(G.F,x0,-2,z0,x1-x0,2,z1-z0,col,op,true);}
floor(0,0,260,310,0xEDE3D3);
floor(260,0,420,310,0xE4E0D8);floor(430,0,630,127,0xE4E0D8);
floor(430,133.5,630,303.5,0xD9E6EE);
floor(0,310,630,860,0xE8DCC6);
const WALLS=[
 {x0:-40,z0:-40,x1:0,z1:900,ext:1},
 {x0:0,z0:-40,x1:630,z1:0,ext:1,ops:[[61,188,0,240,'win'],[281,420,0,240,'entry']]},
 {x0:630,z0:-40,x1:655,z1:900,ext:1},
 {x0:0,z0:860,x1:630,z1:900,ext:1,ops:[[95,182,0,240,'open'],[182,451,0,240,'win'],[451,538,0,240,'open']]},
 {x0:260,z0:0,x1:270,z1:310},
 {x0:420,z0:0,x1:430,z1:310,ops:[[0,75.5,0,240,'door'],[193.5,273.5,0,240,'door']]},
 {x0:430,z0:127,x1:630,z1:133.5},
 {x0:430,z0:303.5,x1:630,z1:310}
];
let wallMode='low';
const WH={full:CEIL,low:110,off:0};
function buildWalls(){
  while(G.H.children.length)G.H.remove(G.H.children[0]);
  const H=WH[wallMode];if(!H)return;
  WALLS.forEach(w=>{
    const alongX=(w.x1-w.x0)>=(w.z1-w.z0);
    const a0=alongX?w.x0:w.z0,a1=alongX?w.x1:w.z1;
    const col=w.ext?0xDAD6CC:0xEFECE5;
    const piece=(p0,p1,y0,y1)=>{if(p1<=p0||y1<=y0)return;
      if(alongX)box(G.H,p0,y0,w.z0,p1-p0,y1-y0,w.z1-w.z0,col);
      else box(G.H,w.x0,y0,p0,w.x1-w.x0,y1-y0,p1-p0,col);};
    const ops=(w.ops||[]).slice().sort((p,q)=>p[0]-q[0]);
    let cur=a0;
    ops.forEach(o=>{
      piece(cur,o[0],0,H);
      piece(o[0],o[1],0,Math.min(o[2],H));
      piece(o[0],o[1],o[3],H);
      if(o[4]==='entry'){
        const t=Math.min(240,H),FRM=0x444441;
        box(G.H,281,0,-24,4,t,8,FRM);
        box(G.H,417,0,-24,3,t,8,FRM);
        box(G.H,325,0,-24,2,t,8,FRM);
        if(H>=240)box(G.H,281,236,-24,139,4,8,FRM);
        box(G.H,285,0,-21,40,Math.min(236,H),2,0x85B7EB,0.35);
      }
      if(o[4]==='win'){
        const gy0=o[2],gy1=Math.min(o[3],H);
        if(gy1>gy0){
          if(alongX)box(G.H,o[0],gy0,(w.z0+w.z1)/2-1,o[1]-o[0],gy1-gy0,2,0x85B7EB,0.35);
          else box(G.H,(w.x0+w.x1)/2-1,gy0,o[0],2,gy1-gy0,o[1]-o[0],0x85B7EB,0.35);
        }
      }
      cur=o[1];
    });
    piece(cur,a1,0,H);
  });
}
G.DR=new THREE.Group();scene.add(G.DR);
(()=>{const piv=new THREE.Group();piv.position.set(417,0,-20);G.DR.add(piv);
 box(piv,-90,0,-2,90,236,4,0x5F5E5A);
 box(piv,-88,95,2,12,1.5,1.5,0xB4B2A9);box(piv,-88,95,-3.5,12,1.5,1.5,0xB4B2A9);
 reg(piv,{type:'swing',amp:-1.6});})();
function terraceDoor(hx,dir,amp){
  const piv=new THREE.Group();piv.position.set(hx,0,880);G.DR.add(piv);
  const x0=dir>0?0:-87,FRM=0x444441;
  box(piv,x0,0,-2.5,87,5,5,FRM);box(piv,x0,235,-2.5,87,5,5,FRM);
  box(piv,x0,0,-2.5,5,240,5,FRM);box(piv,x0+82,0,-2.5,5,240,5,FRM);
  box(piv,x0+5,5,-0.5,77,230,1,0x85B7EB,0.35);
  const hx2=dir>0?70:-82;
  box(piv,hx2,100,-4.5,12,1.5,1.5,0xB4B2A9);
  reg(piv,{type:'swing',amp});
}
terraceDoor(95,1,1.6);
terraceDoor(538,-1,-1.6);
box(G.DR,180,0,876,4,240,8,0x444441);box(G.DR,449,0,876,4,240,8,0x444441);
(()=>{box(G.DR,420,0,192.5,10,240,1,0xE8E6DD);box(G.DR,420,0,273.5,10,240,1,0xE8E6DD);box(G.DR,420,239,192.5,10,1,82,0xE8E6DD);
 const piv=new THREE.Group();piv.position.set(425,0,273.5);G.DR.add(piv);
 box(piv,-2,0,-79.5,4,238,79,0xF1EFE8);
 box(piv,2,100,-76,1.5,1.5,12,0x888780);box(piv,-3.5,100,-76,1.5,1.5,12,0x888780);
 reg(piv,{type:'swing',amp:1.6});})();
G.S.position.z=-20;
const WOOD=0xC9A27A,STEEL=0x2C2C2A,RISE=CEIL/14;
const TREADS=[];
for(let k=0;k<4;k++)TREADS.push([[420+30*k,330],[420+30*(k+1),330],[420+30*(k+1),438],[420+30*k,438]]);
TREADS.push([[540,440],[540,330],[603.5,330]]);
TREADS.push([[540,440],[603.5,330],[630,330],[630,388]]);
TREADS.push([[540,440],[630,388],[630,440]]);
TREADS.push([[540,440],[630,440],[630,492]]);
TREADS.push([[540,440],[630,492],[630,550],[603.5,550]]);
TREADS.push([[540,440],[603.5,550],[540,550]]);
for(let k=0;k<4;k++)TREADS.push([[540-30*k,442],[540-30*k,550],[540-30*(k+1),550],[540-30*(k+1),442]]);
const stMat=new THREE.MeshLambertMaterial({color:WOOD}),spMat=new THREE.MeshLambertMaterial({color:STEEL});
const cents=[];
TREADS.forEach((pts,i)=>{
  const h=RISE*(i+1);
  const sh=new THREE.Shape();sh.moveTo(pts[0][0],pts[0][1]);pts.slice(1).forEach(p=>sh.lineTo(p[0],p[1]));sh.closePath();
  const geo=new THREE.ExtrudeGeometry(sh,{depth:4,bevelEnabled:false});geo.rotateX(Math.PI/2);geo.translate(0,h,0);
  const m=new THREE.Mesh(geo,stMat);G.S.add(m);
  const ln=new THREE.LineSegments(new THREE.EdgesGeometry(geo),lineMat);G.S.add(ln);
  let cx=0,cz=0;pts.forEach(p=>{cx+=p[0];cz+=p[1];});cx/=pts.length;cz/=pts.length;
  cents.push(new THREE.Vector3(cx,h-4,cz));
});
function beam(a,b){
  const len=a.distanceTo(b);if(len<0.1)return;
  const m=new THREE.Mesh(new THREE.BoxGeometry(7,7,len),spMat);
  m.position.copy(a).add(b).multiplyScalar(0.5);m.lookAt(b);G.S.add(m);
}
beam(new THREE.Vector3(cents[0].x,0,cents[0].z),cents[0]);
for(let i=1;i<cents.length;i++)beam(cents[i-1],cents[i]);
for(let x=421;x+6<=540;x+=10)box(G.S,x,0,438,6,CEIL,4,WOOD);

function occluded(v){
  const o=cam.position,dir=v.clone().sub(o),dist=dir.length();dir.normalize();
  occRay.set(o,dir);occRay.far=dist;
  const roots=[G.H,G.L,G.R,G.W,G.T,G.S,G.V,G.TV,G.SF,G.CT,G.WC,G.GR,G.HW,G.DR,G.K,G.KK].filter(g=>g&&g.visible);
  const hits=occRay.intersectObjects(roots,true);
  for(const h of hits){const m=h.object;if(!m.isMesh)continue;
    if(m.material&&m.material.transparent&&m.material.opacity<0.5)continue;
    let q=m,vis=true;while(q){if(!q.visible){vis=false;break;}q=q.parent;}if(!vis)continue;
    return h.distance<dist-10;}
  return false;
}

    joyEl.style.left=(e.clientX-r.left)+'px';joyEl.style.top=(e.clientY-r.top)+'px';joyEl.style.display='block';joyK.style.transform='translate(0,0)';kick();return;}}
  cv.focus({preventScroll:true});if(e.pointerType==='mouse'){for(const [id,q] of pts)if(q.pt==='mouse')pts.delete(id);}pts.set(e.pointerId,{x:e.clientX,y:e.clientY,sx:e.clientX,sy:e.clientY,t0:performance.now(),b:e.button,sh:e.shiftKey,pt:e.pointerType});cv.setPointerCapture(e.pointerId);if(pts.size===2){const a=[...pts.values()];pinch=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);mid={x:(a[0].x+a[1].x)/2,y:(a[0].y+a[1].y)/2};}});
const ray=new THREE.Raycaster();
function visChain(o){while(o){if(!o.visible)return false;o=o.parent;}return true;}
function pick(e){
  const r=cv.getBoundingClientRect();
  const v=new THREE.Vector2(((e.clientX-r.left)/r.width)*2-1,-((e.clientY-r.top)/r.height)*2+1);
  ray.setFromCamera(v,cam);
  const hits=ray.intersectObjects(scene.children,true);
  for(const h of hits){
    const o=h.object;
    if(!o.isMesh||!visChain(o))continue;
    if(o.material&&o.material.transparent&&o.material.opacity<0.5)continue;
    if(MAN_G.visible&&o.parent&&o.parent.parent===MAN_G)continue;
    if(o.userData.tvScreen&&tvVid){if(tvVid.muted){tvVid.muted=false;tvVid.play().catch(()=>{});}else if(tvVid.paused)tvVid.play().catch(()=>{});else tvVid.pause();sndSync();vidLoop();return;}
    let q=o;while(q&&!q.userData.mov)q=q.parent;
    if(q){const m=q.userData.mov;m.target=m.target?0:1;kick();}
    return;
  }
}
function joyEnd(e){if(joy&&e.pointerId===joy.id){joy=null;joyEl.style.display='none';return true;}return false;}
cv.addEventListener('pointerup',e=>{
  if(joyEnd(e))return;
  const p=pts.get(e.pointerId);
  try{if(p&&pts.size===1&&(mode==='fp'||mode==='d3')&&p.b===0&&Math.hypot(e.clientX-p.sx,e.clientY-p.sy)<6&&performance.now()-p.t0<500){if(ruler&&eng)rulerClick(e);else pick(e);}}
  finally{pts.delete(e.pointerId);pinch=0;mid=null;}});
cv.addEventListener('lostpointercapture',e=>{if(joyEnd(e))return;pts.delete(e.pointerId);pinch=0;mid=null;});
cv.addEventListener('pointercancel',e=>{if(joyEnd(e))return;pts.delete(e.pointerId);pinch=0;mid=null;});
cv.addEventListener('pointermove',e=>{
  if(joy&&e.pointerId===joy.id){let dx=e.clientX-joy.sx,dy=e.clientY-joy.sy;const L=Math.hypot(dx,dy);if(L>50){dx*=50/L;dy*=50/L;}joy.dx=dx;joy.dy=dy;joyK.style.transform='translate('+dx+'px,'+dy+'px)';return;}
  if(ruler&&eng&&pts.size===0&&(mode==='d3'||mode==='fp')){if(!rB){rH=snap(floorPoint(e));drawRuler();draw();}return;}
  if(!pts.has(e.pointerId)||(mode!=='d3'&&mode!=='fp'))return;
  const p=pts.get(e.pointerId);
  const k=mode==='fp'?0.3:rad*0.0011;
  if(pts.size===2){
    p.x=e.clientX;p.y=e.clientY;
    const a=[...pts.values()];const d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);
    const m2={x:(a[0].x+a[1].x)/2,y:(a[0].y+a[1].y)/2};
    if(pinch>0&&d>0){if(mode==='fp')tpd=clamp(tpd-(d-pinch)*1.5,0,400);else{rad*=pinch/d;clampR();}}
    if(mid&&mode==='d3')pan(-(m2.x-mid.x)*k*0.5,0,(m2.y-mid.y)*k*0.5);
    pinch=d;mid=m2;draw();return;
  }
  const dx=e.clientX-p.x,dy=e.clientY-p.y;
  if(mode==='fp'){if(p.b===0){yaw+=dx*0.005;pitch=clamp(pitch-dy*0.005,-1.55,1.55);draw();}}
  else if(p.b===2||p.sh)pan(-dx*k,0,dy*k);
  else{th-=dx*0.008;ph=ph+dy*0.008;draw();}
  p.x=e.clientX;p.y=e.clientY;
});
function resize(){W0=el.clientWidth;H0=el.clientHeight;ren.setSize(W0,H0);pc.aspect=fc.aspect=W0/H0;pc.updateProjectionMatrix();fc.updateProjectionMatrix();setView(mode);}
window.addEventListener('resize',resize);
setInterval(()=>{clockTick();if(!raf)draw();},1000);
const engb=document.getElementById('engb'),rulb=document.getElementById('rulb');
function engSync(){engb.classList.toggle('on',eng);rulb.style.display=eng?'block':'none';rulb.classList.toggle('on',ruler);
  document.querySelectorAll('.rl').forEach(d=>d.textContent=eng&&d.dataset.dim?d.dataset.base+' · '+d.dataset.dim:d.dataset.base);}
engb.addEventListener('click',()=>{eng=!eng;if(eng)engBuild();else{ruler=false;rA=rB=rH=null;drawRuler();}engSync();draw();});
document.getElementById('venb').addEventListener('click',e=>{vent=!vent;e.currentTarget.classList.toggle('on',vent);draw();});
document.getElementById('xmb').addEventListener('click',e=>{xmas=!xmas;G.XM.visible=xmas;e.currentTarget.classList.toggle('on',xmas);draw();});
let tvVid=null,tvUrl=null;
const tvs=document.getElementById('tvs');
function sndSync(){if(!tvVid){tvs.style.display='none';return;}tvs.style.display='block';tvs.textContent=tvVid.muted?'🔇 Звук выкл':'🔊 Звук вкл';tvs.classList.toggle('on',!tvVid.muted);}
tvs.addEventListener('click',()=>{if(!tvVid)return;tvVid.muted=!tvVid.muted;if(!tvVid.muted){tvVid.volume=1;tvVid.play().catch(()=>{});vidLoop();}sndSync();});
function vidLoop(){if(tvVid&&!tvVid.paused){draw();requestAnimationFrame(vidLoop);}else draw();}
const tvb=document.getElementById('tvb'),tvf=document.getElementById('tvf');
function tvOff(){if(tvVid){tvVid.pause();tvVid.removeAttribute('src');tvVid.load();tvVid=null;}if(tvUrl){URL.revokeObjectURL(tvUrl);tvUrl=null;}
  if(TVS.tex){TVS.tex.dispose();TVS.tex=null;}buildTV();tvb.textContent='📺 Видео на ТВ';tvb.classList.remove('on');sndSync();draw();}
tvb.addEventListener('click',()=>{if(TVS.tex){tvOff();return;}tvf.value='';tvf.click();});
tvf.addEventListener('change',()=>{
  const f=tvf.files&&tvf.files[0];if(!f)return;
  tvOff();tvUrl=URL.createObjectURL(f);
  if(f.type.startsWith('image/')){
    new THREE.TextureLoader().load(tvUrl,t=>{TVS.tex=t;buildTV();draw();});
  }else{
    const v=document.createElement('video');v.src=tvUrl;v.loop=true;v.playsInline=true;v.crossOrigin='anonymous';
    tvVid=v;TVS.tex=new THREE.VideoTexture(v);TVS.tex.minFilter=THREE.LinearFilter;buildTV();
    v.muted=false;v.volume=1;
    v.play().then(()=>{sndSync();vidLoop();}).catch(()=>{v.muted=true;v.play().then(()=>{sndSync();vidLoop();}).catch(()=>{});sndSync();});
    sndSync();
  }
  tvb.textContent='✕ Выключить ТВ';tvb.classList.add('on');
});
rulb.addEventListener('click',()=>{ruler=!ruler;rA=rB=rH=null;drawRuler();engSync();draw();});
const wrapEl=document.getElementById('wrap'),fsb=document.getElementById('fsb'),fsm=document.getElementById('fsm');
function fsSync(){const on=wrapEl.classList.contains('fs');fsb.textContent=on?'✕ Выйти':'⛶ На весь экран';fsm.textContent=mode==='fp'?'3D':'Изнутри';setTimeout(resize,60);}
fsb.addEventListener('click',()=>{
  const on=wrapEl.classList.contains('fs');
  if(on){wrapEl.classList.remove('fs');try{if(document.fullscreenElement)document.exitFullscreen();else if(document.webkitFullscreenElement)document.webkitExitFullscreen();}catch(_){}fsSync();return;}
  wrapEl.classList.add('fs');
  try{const r=wrapEl.requestFullscreen?wrapEl.requestFullscreen():wrapEl.webkitRequestFullscreen?wrapEl.webkitRequestFullscreen():null;if(r&&r.catch)r.catch(()=>{});}catch(_){}
  fsSync();
});
const fsChange=()=>{if(!document.fullscreenElement&&!document.webkitFullscreenElement&&wrapEl.classList.contains('fs')&&fsWasNative){wrapEl.classList.remove('fs');}fsWasNative=!!(document.fullscreenElement||document.webkitFullscreenElement);fsSync();};
let fsWasNative=false;
document.addEventListener('fullscreenchange',fsChange);document.addEventListener('webkitfullscreenchange',fsChange);
fsm.addEventListener('click',()=>{setView(mode==='fp'?'d3':'fp');fsSync();});
const epIn=document.getElementById('epw'),epV=document.getElementById('epwv');
function epText(){const edge=TVS.zc-tvDims(TVS.diag).w/2,gap=Math.round(edge-(390+epW));epV.textContent=epW+' см'+(gap<0?' (заходит за ТВ на '+(-gap)+' см)':' (до ТВ '+gap+' см)');}
epIn.addEventListener('input',()=>{epW=+epIn.value;epText();buildEP();if(eng)engBuild();draw();});
epText();
const sfx=document.getElementById('sfx'),sfz=document.getElementById('sfz'),sfi=document.getElementById('sfi');
function sofaInfo(){
  const {xb,zs,dep,side}=SOFA,len=SOFA.type==='U'?320:SOFA.len,chL=SOFA.type==='U'?180:SOFA.chL,ze=zs+len;
  const eye=xb+25,dist=Math.round(620-eye),dg=TVS.diag*2.54;
  const pass=Math.round(xb-40);
  const chZ0=side==='S'?ze-100:zs,chZ1=chZ0+100;
  const dd=(hx,hz,px,pz)=>Math.hypot(px-hx,pz-hz);
  const nearL=dd(95,880,clamp(95,xb,xb+chL),clamp(880,zs,ze));
  const doorL=Math.round(nearL-87);
  const tableGap=Math.round(Math.hypot(Math.max(0,xb-185),Math.max(0,zs-495)));
  const toConsole=Math.round(595-(xb+chL));
  sfi.textContent='До экрана от глаз ≈ '+dist+' см ('+(dist/dg).toFixed(2)+' × диагональ) · проход у комода '+pass+' см · до угла стола '+tableGap+' см · запас до двери на террасу '+doorL+' см · от оттоманки до ТВ-тумбы '+toConsole+' см';
}
sfx.addEventListener('input',()=>{SOFA.xb=+sfx.value;document.getElementById('sfxv').textContent=sfx.value;buildSofa();sofaInfo();if(eng)engBuild();draw();});
sfz.addEventListener('input',()=>{SOFA.zs=+sfz.value;document.getElementById('sfzv').textContent=sfz.value;buildSofa();sofaInfo();if(eng)engBuild();draw();});
const ctx=document.getElementById('ctx'),ctz=document.getElementById('ctz');
function ctLab(){const l=labs.find(q=>q.d.textContent==='34');const c=ctDims();if(l)l.v.set(CTS.x+c.dx/2,45,CTS.z+c.dz/2);}
function ctUpdate(){CTS.x=+ctx.value;CTS.z=+ctz.value;buildCT();ctLab();if(eng)engBuild();draw();}
ctx.addEventListener('input',ctUpdate);ctz.addEventListener('input',ctUpdate);
ctUpdate();
sofaInfo();
const tvd=document.getElementById('tvd'),tvx=document.getElementById('tvx'),tvy=document.getElementById('tvy'),tvi=document.getElementById('tvi');
function tvUpdate(){
  TVS.diag=+tvd.value;const {w,h}=tvDims(TVS.diag);
  TVS.zc=clamp(+tvx.value,310+w/2,852-w/2);
  TVS.yc=clamp(+tvy.value,h/2+56,CEIL-h/2-2);
  buildTV();const l=labsTV();if(l)l.v.set(618,TVS.yc,TVS.zc);
  const bot=Math.round(TVS.yc-h/2),top=Math.round(TVS.yc+h/2),gap=bot-55;
  const mid=Math.round(TVS.zc-691);
  tvi.textContent=TVS.diag+'" ≈ '+w+'×'+h+' см · низ '+bot+' см, верх '+top+' см · над тумбой '+gap+' см · '+(mid===0?'по центру между лестницей и шторами':(mid>0?'смещён к шторам на '+mid+' см':'смещён к лестнице на '+(-mid)+' см'));
  epText();sofaInfo();if(eng)engBuild();draw();
}
[tvd,tvx,tvy].forEach(e=>e.addEventListener('input',tvUpdate));tvd.addEventListener('change',tvUpdate);
tvUpdate();
buildWalls();
setView('d3');
